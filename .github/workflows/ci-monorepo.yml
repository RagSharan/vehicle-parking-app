# Generated by Pingla. Review it in the pull request; add your own build, image and publish steps as needed.
name: "ci-monorepo"
on:
  push:
    branches: ["main"]
  workflow_dispatch: {}
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: ["customer-service", "parking-service", "payment-service", "reporting-service", "vehicle-service"]
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.dir }}/go.mod
      - run: go mod download
      - run: go test ./...
