# Generated by Pingla from your CI/CD plan. Review it in the pull request.
# Secrets this workflow reads are set by Pingla in the repository settings; none are written here.
name: "ci-live-test"
on:
  push:
    branches: ["main"]
  workflow_dispatch: {}
permissions:
  contents: read
  packages: write
  id-token: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m pytest
  scan:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          severity: CRITICAL,HIGH
          exit-code: "1"
